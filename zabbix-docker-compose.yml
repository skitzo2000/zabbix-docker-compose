networks:
  zabbix-network:
    external: true

volumes:
  zabbix-postgres:
  zabbix-postgres-backup:
  zabbix-database-backups:
  signal-cli-data:

services:
  postgres:
    image: ${ZABBIX_POSTGRES_IMAGE_TAG}
    # Postgres stock defaults (shared_buffers 128MB, autovacuum at 20% dead
    # rows) on a 24 GB DB made the hourly housekeeper DELETEs and the history
    # syncers stall, firing "housekeeper over 75%" (paul/zabbix#10). Sized for
    # the 16 GB komodo CT that shares RAM with other stacks.
    command: >-
      postgres
      -c shared_buffers=${ZABBIX_PG_SHARED_BUFFERS:-2GB}
      -c effective_cache_size=${ZABBIX_PG_EFFECTIVE_CACHE_SIZE:-6GB}
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c autovacuum_work_mem=256MB
      -c max_wal_size=4GB
      -c min_wal_size=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c autovacuum_vacuum_scale_factor=0.02
      -c autovacuum_analyze_scale_factor=0.01
      -c autovacuum_vacuum_insert_scale_factor=0.05
      -c autovacuum_vacuum_cost_limit=1000
    shm_size: 256m
    volumes:
      - zabbix-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME}
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
    networks:
      - zabbix-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${ZABBIX_DB_NAME}", "-U", "${ZABBIX_DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE_TAG}
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${ZABBIX_DB_NAME}
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_CACHESIZE: ${ZABBIX_CACHESIZE:-128M}
      ZBX_HISTORYCACHESIZE: ${ZABBIX_HISTORYCACHESIZE:-128M}
      ZBX_HISTORYINDEXCACHESIZE: ${ZABBIX_HISTORYINDEXCACHESIZE:-32M}
      ZBX_TRENDCACHESIZE: ${ZABBIX_TRENDCACHESIZE:-64M}
      ZBX_TRENDFUNCTIONCACHESIZE: ${ZABBIX_TRENDFUNCTIONCACHESIZE:-64M}
      ZBX_VALUECACHESIZE: ${ZABBIX_VALUECACHESIZE:-512M}
      # Default is 1 pinger; a single slow fping run pushed it past 75% busy
      # (2026-10-07). 3 gives headroom for the ICMP simple checks.
      ZBX_STARTPINGERS: ${ZABBIX_STARTPINGERS:-3}
    mem_limit: 4g
    mem_reservation: 2g
    networks:
      - zabbix-network
    ports:
      - "10051:10051"
    healthcheck:
      test: grep -qr "zabbix_server" /proc/*/status || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  zabbix-dashboard:
    image: ${ZABBIX_WEB_IMAGE_TAG}
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${ZABBIX_DB_NAME}
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${ZABBIX_TIMEZONE}
    networks:
      - zabbix-network
    ports:
      - "8888:8080"
      - "1443:8443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy

  zabbix-agent:
    image: ${ZABBIX_AGENT_IMAGE_TAG}
    environment:
      ZBX_HOSTNAME: Zabbix server
      ZBX_SERVER_HOST: zabbix-server
    networks:
      - zabbix-network
    restart: unless-stopped
    depends_on:
      - postgres
      - zabbix-server

  zabbix-diagnoser:
    build: ./diagnoser
    environment:
      DIAG_GROQ_API_KEY: ${DIAG_GROQ_API_KEY}
      DIAG_GROQ_MODEL: ${DIAG_GROQ_MODEL:-llama-3.3-70b-versatile}
      DIAG_DISCORD_BOT_TOKEN: ${DIAG_DISCORD_BOT_TOKEN}
      DIAG_DISCORD_GUILD_ID: ${DIAG_DISCORD_GUILD_ID}
      DIAG_DISCORD_CHANNEL_NAME: ${DIAG_DISCORD_CHANNEL_NAME:-jones-alerts}
      DIAG_BRAIN_TOKEN: ${DIAG_BRAIN_TOKEN:-}
      DIAG_BRAIN_PROXY_URL: ${DIAG_BRAIN_PROXY_URL:-https://mcp.thenortonfamily.net/v1}
      DIAG_BRAIN_NAMESPACE: ${DIAG_BRAIN_NAMESPACE:-goldfish-paul-gmail-com:zabbix-docker-compose}
    networks:
      - zabbix-network
    restart: unless-stopped

  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    environment:
      # json-rpc mode keeps a persistent signal-cli daemon attached for 24/7
      # receive. Sending via /v2/send still works; messages can be polled from
      # /v1/receive/{number} or streamed via the WebSocket endpoint.
      MODE: json-rpc
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli
    networks:
      - zabbix-network
    ports:
      - "8082:8080"
    restart: unless-stopped

  backups:
    image: ${ZABBIX_POSTGRES_IMAGE_TAG}
    command: >-
      sh -c 'sleep $ZABBIX_BACKUP_INIT_SLEEP &&
      while true; do
        pg_dump -h postgres -p 5432 -d $ZABBIX_DB_NAME -U $ZABBIX_DB_USER | gzip > $ZABBIX_POSTGRES_BACKUPS_PATH/$ZABBIX_POSTGRES_BACKUP_NAME-$(date "+%Y-%m-%d_%H-%M").gz &&
        find $ZABBIX_POSTGRES_BACKUPS_PATH -type f -mtime +$ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS | xargs rm -f &&
        sleep $ZABBIX_BACKUP_INTERVAL; done'
    volumes:
      - zabbix-postgres-backup:/var/lib/postgresql/data
      - zabbix-database-backups:${ZABBIX_POSTGRES_BACKUPS_PATH}
    environment:
      ZABBIX_DB_NAME: ${ZABBIX_DB_NAME}
      ZABBIX_DB_USER: ${ZABBIX_DB_USER}
      PGPASSWORD: ${ZABBIX_DB_PASSWORD}
      ZABBIX_BACKUP_INIT_SLEEP: ${ZABBIX_BACKUP_INIT_SLEEP}
      ZABBIX_BACKUP_INTERVAL: ${ZABBIX_BACKUP_INTERVAL}
      ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS: ${ZABBIX_POSTGRES_BACKUP_PRUNE_DAYS}
      ZABBIX_POSTGRES_BACKUPS_PATH: ${ZABBIX_POSTGRES_BACKUPS_PATH}
      ZABBIX_POSTGRES_BACKUP_NAME: ${ZABBIX_POSTGRES_BACKUP_NAME}
    networks:
      - zabbix-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
